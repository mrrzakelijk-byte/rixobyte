<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#192b36"/><stop offset="1" stop-color="#48616a"/></linearGradient>
<radialGradient id="lightGlow"><stop stop-color="#e4d5a5" stop-opacity=".35"/><stop offset=".46" stop-color="#e4d5a5" stop-opacity=".12"/><stop offset="1" stop-color="#e4d5a5" stop-opacity="0"/></radialGradient>
<radialGradient id="warmGlow"><stop stop-color="#ffc57e" stop-opacity=".8"/><stop offset=".43" stop-color="#ffad57" stop-opacity=".3"/><stop offset="1" stop-color="#fcb068" stop-opacity="0"/></radialGradient></defs><style>
@keyframes drift{0%,100%{transform:translateX(-20px)}50%{transform:translateX(25px)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.9}}
@keyframes flow{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes flick{0%,100%{transform:scale(.92,1.06)}50%{transform:scale(1.08,.91)}}
.clouds,.mist{animation:drift 55s ease-in-out infinite}.mist{animation-duration:31s;animation-direction:reverse}.waterline{animation:flow 13s ease-in-out infinite}.firefly{animation:twinkle 5.5s ease-in-out infinite}.aurora{animation:drift 23s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.clouds,.mist,.waterline,.firefly,.aurora,.pulse,.flame{animation:none}}</style>
